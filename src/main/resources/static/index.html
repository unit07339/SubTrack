<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubTrack - 스마트 구독서비스 관리</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-brand-500 selection:text-white">

    <!-- App Header & Navigation Bar -->
    <header class="sticky top-0 z-40 bg-slate-900/80 backdrop-blur-md border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <!-- Logo -->
            <div class="flex items-center space-x-3 cursor-pointer" onclick="switchTab('dashboard')">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-400 flex items-center justify-center shadow-lg shadow-brand-500/20">
                    <i data-lucide="layers" class="w-5 h-5 text-white"></i>
                </div>
                <div>
                    <span class="text-xl font-bold tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">SubTrack</span>
                    <span class="text-xs text-indigo-400 font-medium ml-1.5 px-1.5 py-0.5 bg-indigo-950/60 border border-indigo-800/40 rounded">Serverless</span>
                </div>
            </div>

            <!-- Quick CTA Button -->
            <div class="flex items-center space-x-3">
                <button onclick="openSubscriptionModal()" class="flex items-center space-x-2 px-4 py-2 bg-brand-600 hover:bg-brand-500 text-white rounded-lg text-sm font-semibold transition-all shadow-md shadow-brand-600/30 active:scale-95">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">구독 추가</span>
                </button>
            </div>
        </div>

        <!-- Tab Navigation Bar -->
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 border-t border-slate-800/60">
            <nav class="flex space-x-2 py-2 overflow-x-auto" aria-label="Tabs">
                <button onclick="switchTab('dashboard')" id="tab-dashboard" class="nav-tab active flex items-center space-x-2 px-3.5 py-2 rounded-lg text-sm text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">
                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                    <span>대시보드</span>
                </button>
                <button onclick="switchTab('subscriptions')" id="tab-subscriptions" class="nav-tab flex items-center space-x-2 px-3.5 py-2 rounded-lg text-sm text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">
                    <i data-lucide="list" class="w-4 h-4"></i>
                    <span>구독 목록</span>
                </button>
                <button onclick="switchTab('calendar')" id="tab-calendar" class="nav-tab flex items-center space-x-2 px-3.5 py-2 rounded-lg text-sm text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">
                    <i data-lucide="calendar" class="w-4 h-4"></i>
                    <span>결제 캘린더</span>
                </button>
                <button onclick="switchTab('analytics')" id="tab-analytics" class="nav-tab flex items-center space-x-2 px-3.5 py-2 rounded-lg text-sm text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">
                    <i data-lucide="pie-chart" class="w-4 h-4"></i>
                    <span>지출 분석</span>
                </button>
            </nav>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
        
        <!-- 1. DASHBOARD VIEW -->
        <section id="view-dashboard" class="space-y-6 animate-fade-in">
            <!-- Metrics Row -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                <div class="glass-card p-5 rounded-2xl">
                    <div class="flex items-center justify-between text-slate-400 text-sm mb-2">
                        <span>이번 달 예상 지출액</span>
                        <i data-lucide="credit-card" class="w-4 h-4 text-brand-400"></i>
                    </div>
                    <div class="text-3xl font-extrabold text-white" id="metric-monthly-total">₩0</div>
                    <div class="text-xs text-slate-500 mt-2">활성 구독 서비스 기준 월 환산액</div>
                </div>

                <div class="glass-card p-5 rounded-2xl">
                    <div class="flex items-center justify-between text-slate-400 text-sm mb-2">
                        <span>연간 환산 예상 지출</span>
                        <i data-lucide="trending-up" class="w-4 h-4 text-emerald-400"></i>
                    </div>
                    <div class="text-3xl font-extrabold text-emerald-400" id="metric-yearly-total">₩0</div>
                    <div class="text-xs text-slate-500 mt-2">1년간 누적 예상 구독 비용</div>
                </div>

                <div class="glass-card p-5 rounded-2xl">
                    <div class="flex items-center justify-between text-slate-400 text-sm mb-2">
                        <span>관리 중인 구독 서비스</span>
                        <i data-lucide="sparkles" class="w-4 h-4 text-amber-400"></i>
                    </div>
                    <div class="text-3xl font-extrabold text-white">
                        <span id="metric-active-count">0</span><span class="text-lg font-normal text-slate-400 ml-1">개</span>
                        <span class="text-sm font-normal text-slate-500 ml-2">(일시정지: <span id="metric-paused-count">0</span>개)</span>
                    </div>
                    <div class="text-xs text-slate-500 mt-2">정기 결제 구독 상태 모니터링 중</div>
                </div>
            </div>

            <!-- Two Columns: Upcoming Bills & Spending Overview -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Upcoming Bills (D-7) -->
                <div class="lg:col-span-2 glass-card p-6 rounded-2xl">
                    <div class="flex items-center justify-between mb-4">
                        <div class="flex items-center space-x-2">
                            <i data-lucide="bell" class="w-5 h-5 text-amber-400"></i>
                            <h2 class="text-lg font-bold text-white">다가오는 결제 일정 (Next 7 Days)</h2>
                        </div>
                        <span class="text-xs text-slate-400 bg-slate-800 px-2.5 py-1 rounded-full" id="upcoming-badge">0건 대기</span>
                    </div>

                    <div id="upcoming-list" class="space-y-3">
                        <!-- Upcoming items rendered here -->
                        <div class="text-center py-10 text-slate-500 text-sm">
                            <i data-lucide="check-circle" class="w-8 h-8 mx-auto mb-2 opacity-40"></i>
                            향후 7일 이내에 예정된 결제 건이 없습니다.
                        </div>
                    </div>
                </div>

                <!-- Category Spending Quick Chart -->
                <div class="glass-card p-6 rounded-2xl flex flex-col">
                    <h2 class="text-lg font-bold text-white mb-4 flex items-center space-x-2">
                        <i data-lucide="pie-chart" class="w-5 h-5 text-indigo-400"></i>
                        <span>카테고리별 비중</span>
                    </h2>
                    <div class="flex-1 relative flex items-center justify-center min-h-[220px]">
                        <canvas id="chart-category-mini"></canvas>
                    </div>
                </div>
            </div>
        </section>

        <!-- 2. SUBSCRIPTIONS VIEW -->
        <section id="view-subscriptions" class="space-y-6 hidden animate-fade-in">
            <!-- Filter & Search Bar -->
            <div class="flex flex-col sm:flex-row items-center justify-between gap-4 glass-card p-4 rounded-xl">
                <!-- Status Filter Tabs -->
                <div class="flex space-x-2 w-full sm:w-auto">
                    <button onclick="filterSubscriptions('ALL')" class="sub-filter-btn active px-3 py-1.5 text-xs font-semibold rounded-lg bg-indigo-600 text-white transition-all">전체</button>
                    <button onclick="filterSubscriptions('ACTIVE')" class="sub-filter-btn px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 text-slate-400 hover:text-white transition-all">활성</button>
                    <button onclick="filterSubscriptions('PAUSED')" class="sub-filter-btn px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 text-slate-400 hover:text-white transition-all">일시정지</button>
                </div>

                <!-- Category Dropdown & Add Button -->
                <div class="flex items-center space-x-3 w-full sm:w-auto">
                    <select id="select-category-filter" onchange="filterByCategory(this.value)" class="bg-slate-800 border border-slate-700 text-slate-200 text-xs rounded-lg px-3 py-2 outline-none focus:border-brand-500">
                        <option value="">모든 카테고리</option>
                        <option value="ENTERTAINMENT">엔터테인먼트</option>
                        <option value="PRODUCTIVITY">생산성/업무</option>
                        <option value="MUSIC">음원/오디오</option>
                        <option value="LIFESTYLE">생활/쇼핑</option>
                        <option value="EDUCATION">교육/도서</option>
                        <option value="OTHER">기타</option>
                    </select>

                    <button onclick="openSubscriptionModal()" class="px-3.5 py-2 bg-brand-600 hover:bg-brand-500 text-white rounded-lg text-xs font-semibold flex items-center space-x-1.5 whitespace-nowrap">
                        <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                        <span>구독 등록</span>
                    </button>
                </div>
            </div>

            <!-- Subscription Cards Grid -->
            <div id="subscription-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                <!-- Dynamically populated -->
            </div>
        </section>

        <!-- 3. CALENDAR VIEW -->
        <section id="view-calendar" class="space-y-6 hidden animate-fade-in">
            <div class="glass-card p-6 rounded-2xl">
                <!-- Calendar Header -->
                <div class="flex items-center justify-between mb-6">
                    <div class="flex items-center space-x-3">
                        <i data-lucide="calendar" class="w-6 h-6 text-brand-400"></i>
                        <h2 class="text-xl font-bold text-white" id="calendar-title">2026년 10월 결제 캘린더</h2>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button onclick="changeMonth(-1)" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300">
                            <i data-lucide="chevron-left" class="w-4 h-4"></i>
                        </button>
                        <button onclick="resetMonth()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-300">이번달</button>
                        <button onclick="changeMonth(1)" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300">
                            <i data-lucide="chevron-right" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <!-- Calendar Grid -->
                <div class="grid grid-cols-7 gap-2 mb-2 text-center text-xs font-semibold text-slate-400">
                    <span class="text-rose-400">일</span>
                    <span>월</span>
                    <span>화</span>
                    <span>수</span>
                    <span>목</span>
                    <span>금</span>
                    <span class="text-indigo-400">토</span>
                </div>
                <div id="calendar-days" class="grid grid-cols-7 gap-2">
                    <!-- Days generated dynamically -->
                </div>
            </div>
        </section>

        <!-- 4. ANALYTICS VIEW -->
        <section id="view-analytics" class="space-y-6 hidden animate-fade-in">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- Category Breakdown Large Chart -->
                <div class="glass-card p-6 rounded-2xl">
                    <h2 class="text-lg font-bold text-white mb-4 flex items-center space-x-2">
                        <i data-lucide="pie-chart" class="w-5 h-5 text-indigo-400"></i>
                        <span>카테고리별 지출 분포</span>
                    </h2>
                    <div class="relative min-h-[300px] flex items-center justify-center">
                        <canvas id="chart-category-large"></canvas>
                    </div>
                </div>

                <!-- Top Expensive Subscriptions Ranking -->
                <div class="glass-card p-6 rounded-2xl">
                    <h2 class="text-lg font-bold text-white mb-4 flex items-center space-x-2">
                        <i data-lucide="award" class="w-5 h-5 text-amber-400"></i>
                        <span>최고 지출 구독 서비스 Top 5</span>
                    </h2>
                    <div id="top-expensive-list" class="space-y-3">
                        <!-- Top expensive items -->
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Modal: Add / Edit Subscription -->
    <div id="modal-subscription" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center hidden p-4">
        <div class="glass-card bg-slate-900 border border-slate-700 rounded-2xl max-w-lg w-full p-6 space-y-5 shadow-2xl animate-fade-in">
            <div class="flex items-center justify-between pb-3 border-b border-slate-800">
                <h3 class="text-lg font-bold text-white" id="modal-title">새 구독 서비스 등록</h3>
                <button onclick="closeSubscriptionModal()" class="text-slate-400 hover:text-white p-1">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Popular Presets Quick Select -->
            <div class="space-y-1.5">
                <label class="text-xs text-slate-400 font-medium">인기 프리셋 원클릭 선택</label>
                <div class="flex flex-wrap gap-2" id="preset-buttons">
                    <!-- Presets injected here -->
                </div>
            </div>

            <form id="form-subscription" onsubmit="handleSubscriptionSubmit(event)" class="space-y-4">
                <input type="hidden" id="sub-id">

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">서비스명 *</label>
                    <input type="text" id="sub-name" required placeholder="예: 넷플릭스 (Netflix)" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3.5 py-2 text-sm text-white focus:outline-none focus:border-brand-500">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">결제 금액 (원) *</label>
                        <input type="number" id="sub-cost" required min="0" placeholder="17000" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3.5 py-2 text-sm text-white focus:outline-none focus:border-brand-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">결제일 (매월 N일) *</label>
                        <input type="number" id="sub-billing-day" required min="1" max="31" placeholder="25" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3.5 py-2 text-sm text-white focus:outline-none focus:border-brand-500">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">결제 주기</label>
                        <select id="sub-cycle" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3.5 py-2 text-sm text-white focus:outline-none focus:border-brand-500">
                            <option value="MONTHLY">월간 (매월)</option>
                            <option value="YEARLY">연간 (매년)</option>
                            <option value="WEEKLY">주간 (매주)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">카테고리</label>
                        <select id="sub-category" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3.5 py-2 text-sm text-white focus:outline-none focus:border-brand-500">
                            <option value="ENTERTAINMENT">엔터테인먼트</option>
                            <option value="PRODUCTIVITY">생산성/업무</option>
                            <option value="MUSIC">음원/오디오</option>
                            <option value="LIFESTYLE">생활/쇼핑</option>
                            <option value="EDUCATION">교육/도서</option>
                            <option value="OTHER">기타</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">결제 수단</label>
                    <input type="text" id="sub-payment-method" placeholder="예: 신한카드, 카카오페이" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3.5 py-2 text-sm text-white focus:outline-none focus:border-brand-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">메모</label>
                    <input type="text" id="sub-memo" placeholder="예: 4인 가족 공유 요금제" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3.5 py-2 text-sm text-white focus:outline-none focus:border-brand-500">
                </div>

                <div class="flex justify-end space-x-3 pt-3 border-t border-slate-800">
                    <button type="button" onclick="closeSubscriptionModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-semibold rounded-lg transition-colors">취소</button>
                    <button type="submit" class="px-5 py-2 bg-brand-600 hover:bg-brand-500 text-white text-sm font-semibold rounded-lg transition-all shadow-md shadow-brand-600/30">저장하기</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
        });
    </script>
</body>
</html>
